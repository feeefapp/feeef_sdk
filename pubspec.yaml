name: feeef
description: Feeef SDK - API client, repositories, and integrations for Feeef apps.
version: 1.4.0
# publish_to: 'none'  # Uncomment to prevent publishing; remove to publish to pub.dev
# homepage: https://github.com/your-org/feeef
# repository: https://github.com/your-org/feeef
# issue_tracker: https://github.com/your-org/feeef/issues

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  cuid2:
    git:
      url: https://github.com/mohamadlounnas/cuid2
      ref: master
  diacritic: ^0.1.6
  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  http_parser: ^4.0.2
  json_annotation: ^4.11.0
  path: ^1.9.0
  petitparser: ^7.0.0
  recase: ^4.1.0
  transmit_client: ^1.2.1

dev_dependencies:
  build_runner: ^2.4.13
  # Dart 3.13 forbids `final` on constructor params; Freezed 3.x still emits that.
  freezed: 4.0.0-dev.3
  json_serializable: ^6.9.0
  lints: ^6.0.0
  test: ^1.25.6
